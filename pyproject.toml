[project]
name = "medical-rag-chatbot"
version = "0.1.0"
description = "Chatbot RAG pour documents médicaux (LangChain + ChromaDB + Mistral-7B via Ollama + Streamlit)"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.5",
    "pypdf>=4.3.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "langchain-text-splitters>=1.1.2",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
